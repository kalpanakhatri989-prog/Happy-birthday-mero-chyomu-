<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Chyomu 🤍</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Floating Hearts -->
    <div id="hearts"></div>

    <!-- Hero Section -->
    <section class="hero" id="hero">

        <div class="glass">

            <h3>✨ A Little Surprise ✨</h3>

            <h1>Happy Birthday,<br>Chyomu ❤️</h1>

            <p>
                I made something with all my heart just for you.<br>
                I hope this little surprise makes you smile.
            </p>

            <button id="openBtn">
                Open My Heart ❤️
            </button>

        </div>

    </section>

    <!-- Letter Section -->
    <section class="letter hidden" id="letter">

        <div class="glass">

            <h1>To My Baby ❤️</h1>

            <p id="typing"></p>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
